appId: com.kuratoolkit.app
productName: Kura Toolkit
directories:
  output: release
  buildResources: build
artifactName: "kura-toolkit-${version}-${os}-${arch}.${ext}"
afterAllArtifactBuild: scripts/zip-portable.js
portable:
  artifactName: "kura-toolkit-${version}-${os}-${arch}-portable.${ext}"
  buildUniversalInstaller: false
publish:
  provider: github
  owner: jp-yendo
  repo: kura_toolkit
  releaseType: draft
releaseInfo:
  releaseName: "v${version}"
  releaseNotes: |
    ## New Features

    -

    ## Bug Fixes

    -

# ネイティブモジュール (.node) と、それが読み込む共有ライブラリ (sharp の libvips) は asar 内からロードできないため展開する
asarUnpack:
  - "**/node_modules/@neplex/**"
  - "**/node_modules/sharp/**"
  - "**/node_modules/@img/**"
  - "**/node_modules/@resvg/**"

# 音声機能の Python 補助スクリプトと、外部から取り込んだデータ (学習用の読み上げ文とそのライセンス)。
# 仮想環境の Python から直接読むため asar に入れない
extraResources:
  - from: src/python
    to: python
    filter:
      - "**/*.py"
      - "requirements/*.in"
      - "requirements/*.lock.txt"
  - from: third_party
    to: third_party
  # AGPL-3.0 で配布するため、ライセンス本文を配布物に含める
  - from: LICENSE
    to: LICENSE.txt

files:
  - dist/**/*
  - public/**/*
  - "!**/*.ts"
  - "!**/*.tsx"
  - "!**/*.map"
  - "!**/node_modules/*/{CHANGELOG.md,README.md,README,readme.md,readme}"
  - "!**/node_modules/*/{test,__tests__,tests,powered-test,example,examples}"
  - "!**/node_modules/*.d.ts"
  - "!**/node_modules/.bin"

win:
  icon: public/icon.ico
  executableName: kura_toolkit
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: portable
      arch:
        - x64
        - arm64

nsis:
  shortcutName: Kura Toolkit
  buildUniversalInstaller: false
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  deleteAppDataOnUninstall: true

mac:
  category: public.app-category.utilities
  icon: public/icon.png
  hardenedRuntime: true
  gatekeeperAssess: false
  notarize: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  # TCC の許可ダイアログに表示される利用目的。未指定だとダイアログが出ずに拒否される場合がある
  extendInfo:
    NSDesktopFolderUsageDescription: "Kura Toolkit searches the Desktop folder for junk files to clean up."
    NSDocumentsFolderUsageDescription: "Kura Toolkit searches the Documents folder for junk files to clean up."
    NSDownloadsFolderUsageDescription: "Kura Toolkit searches the Downloads folder for junk files to clean up."
    NSRemovableVolumesUsageDescription: "Kura Toolkit searches removable volumes for junk files to clean up."
    NSNetworkVolumesUsageDescription: "Kura Toolkit searches network volumes for junk files to clean up."
    NSFileProviderDomainUsageDescription: "Kura Toolkit searches cloud storage folders for junk files to clean up."
    NSMicrophoneUsageDescription: "Kura Toolkit records your voice to train voice models for Voice Conversion and Text to Speech."
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

linux:
  icon: public/icon.png
  category: Utility
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
    - target: rpm
      arch:
        - x64
        - arm64
  desktop:
    entry:
      Name: Kura Toolkit
      Comment: "Integrated desktop utilities for audio, video, image and file cleanup."
      Categories: Utility;
